name: Delete all repo files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove everything except .github and os.7z'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete everything except .github and os.7z
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'os.7z' \
            -exec rm -rf {} +
          ls -la

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete."
          else
            git commit -m "Delete all files except .github and os.7z"
            git push
          fi
