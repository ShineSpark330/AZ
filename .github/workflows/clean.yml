name: Delete all repo files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove everything except .github and os.7z'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check os.7z is here first
        run: |
          echo "Files at the top of the repo:"
          ls -la
          # Stop before deleting anything if the archive isn't exactly os.7z
          # at the top level (a different name, another folder or another
          # branch would otherwise leave the repo with no archive).
          [ -f os.7z ] || { echo "os.7z not found at the repo root on this branch - nothing deleted." >&2; exit 1; }

      - name: Delete everything except .github and os.7z
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'os.7z' \
            -exec rm -rf {} +
          ls -la
          [ -f os.7z ] || { echo "os.7z is gone after cleaning" >&2; exit 1; }

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete."
          else
            git commit -m "Delete all files except .github and os.7z"
            git push
          fi
